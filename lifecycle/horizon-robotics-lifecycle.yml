  documentation tree per chip generation per release — but publishes no API lifecycle
  policy of any kind for its machine surface. No status page, no deprecation policy, no
  sunset headers, no SLA, no end-of-life schedule. Version discipline is good at the
  artifact level and absent at the service level.
