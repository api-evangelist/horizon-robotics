aid: horizon-robotics
name: Horizon Robotics
description: 'Horizon Robotics (Hong Kong Stock Exchange: 9660.HK) is a Chinese provider
  of smart-driving computing solutions, founded in 2015, that designs the Journey (征程)
  family of automotive AI processors around its proprietary BPU (Brain Processing Unit)
  architecture and pairs them with a full software stack — Horizon Mono ADAS, Horizon
  SuperDrive assisted driving, TogetheROS, Matrix, QoHo and AIDI. Its developer-facing
  surface is not a hosted web API but a toolchain: OpenExplorer (OE), the model
  compilation, quantization and deployment kit built around HBDK, HMCT, the Horizon
  PyTorch Plugin, horizon_tc_ui and the UCP on-board runtime, documented at
  developer.horizon.auto and doc.oe.horizon.auto. Horizon publishes two genuine agent
  surfaces on top of that toolchain: a live, unauthenticated remote Model Context
  Protocol server at mcp.oe.horizon.auto that exposes semantic code and documentation
  retrieval, and OE-Skills, an Apache-2.0 pack of 37 structured Agent Skills for
  Claude Code, Codex and Cursor that drive HBDK compilation, PTQ/QAT quantization,
  UCP on-board inference and LLM compression.'
