source: https://mcp.oe.horizon.auto/mcp
name: Open Explorer MCP Server
description: >-
  Horizon Robotics' hosted Model Context Protocol server for the OpenExplorer (OE)
  toolchain. It gives a coding agent semantic retrieval over Horizon's indexed
  codebases (Milvus-backed) and the Horizon documentation library, so an agent can
  locate an implementation, a configuration entry point or a manual passage before
  it acts. Advertised by Horizon Robotics in the install instructions of its own
  OE-Skills repository.
status: live
deployment:
  mode: remote
  endpoint: https://mcp.oe.horizon.auto/mcp
  transport: streamable-http
  auth: none
  verified: probed
protocol:
  spec: Model Context Protocol
  version: '2025-06-18'
  server_info:
    name: Open Explorer MCP Server
    version: 3.9.0
  capabilities:
    tools: true
    resources: true
    prompts: false            # prompts/list returns JSON-RPC -32601 Method not found
tool_count: 4
tools:
- name: list_codebases
  summary: List the codebases / Milvus collections currently indexed and available as search scope.
  read_only: true
  idempotent: true
  required_params: []
- name: search_code
  summary: Semantic natural-language search across indexed Horizon codebases, optionally scoped to named collections.
  read_only: true
  idempotent: true
  required_params: [query]
- name: search_doc
  summary: Semantic search of Horizon document snippets — manuals, guides, references. Defaults to the `oe_doc` library.
  read_only: true
  idempotent: true
  required_params: [query]
- name: get_doc
  summary: Read the full content overview of a document by docId, normally after search_doc returns one.
