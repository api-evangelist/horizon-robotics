summary: >-
  Horizon Robotics publishes no error reference for its machine surface. The Open Explorer
  MCP server returns errors in the JSON-RPC 2.0 envelope mandated by the Model Context
  Protocol, and one error was observed directly during probing. Nothing beyond the JSON-RPC
  base codes is documented, and no error catalogue exists in the OpenExplorer manual for
  the MCP surface — so this file records only what was actually seen on the wire plus the
  spec-mandated envelope, and does not enumerate codes the provider has not published.
envelope:
  transport: 'HTTP 200 with a text/event-stream `event: message` frame'
  shape: '{"jsonrpc":"2.0","id":<id>,"error":{"code":<int>,"message":<string>,"data":<any?>}}'
  note: >-
    Protocol errors ride a 200 response; the HTTP status is not the error signal. An agent
    must parse the JSON-RPC body. Tool-level failures are returned as a tool result with
    `isError: true` rather than a JSON-RPC error, per MCP.
