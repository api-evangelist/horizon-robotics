entries:
- component: j6-hbdk-compile
  version: 1.1.8
  date: '2026-06-11'
  breaking: false
  highlights:
  - Reworked the `remove_nodes` deletion strategy — Quantize/Dequantize/Cast now handled as one class, Reshape/Transpose split out as a layout class removed at the end of the flow.
  - Fixed post-convert operator type matching so a config string such as "Cast" no longer produces a spurious "node not found" and skip a deletion that should have happened.
  - Added `_normalize_op_types()` to `_remove_op_connected_to_io`, accepting a type list and filtering via `matches_remove_op_type()`.
- component: j6-hbdk-compile
  version: 1.1.7
  date: '2026-04-21'
  breaking: false
  highlights:
  - 'SKILL.md hardened: any model legality check failure must terminate the workflow immediately rather than continuing with `-c` or claiming a validation that did not happen.'
  - Added explicit hard gates and a list of prohibited agent behaviours.
- component: OE-Skills pack
  version: 0.2.0
  date: '2026-06-30'
  breaking: false
  highlights:
