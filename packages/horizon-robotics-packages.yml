summary: >-
  Horizon Robotics ships a substantial first-party Python/C++ SDK surface, but NONE of it
  is published to a public package registry. Every library below is distributed only
  inside the versioned OpenExplorer (OE) release package — a tarball or Docker image
  downloaded from the Horizon developer portal behind an account. npm, PyPI, Maven
  Central, NuGet, pkg.go.dev, RubyGems, Packagist and crates.io were all probed and
  returned 404 for every candidate name, so there is no registry metadata endpoint to
  read a version or a publication date from. `version: null` on each entry means
  "checked, nothing published", not "not checked". A consumer cannot pin a Horizon SDK
  by version from any public index, and cannot tell from outside whether the copy they
  hold is current.
